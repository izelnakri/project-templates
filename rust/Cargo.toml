[package]
name = "github_user_fetcher"
version = "0.1.0"
edition = "2024"

[[bench]]
name = "config_bench"
harness = false

[[bench]]
name = "user_bench"
harness = false

[[bin]]
name = "github_user_fetcher"
path = "src/main.rs"

[[bin]]
name = "github_user_fetcher_gui"
path = "src/gui.rs"

[lib]
name = "github_user_fetcher"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
poem = { version = "3.1.10", features = ["static-files"] }
poem-openapi = { version = "5.1.14", features = ["swagger-ui"] }
reqwest = { version = "0.12.15", features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.0", features = ["full"] }
gtk4 = "0.9.6"
glib = "0.20.10"
serde_json = "1.0" # Do I really need this?
async-channel = "2.3.1" # Is this really needed or most elegant solution?, Maybe use use tokio::sync::mpsc;

[dev-dependencies]
criterion = { version = "0.6.0", features = ["async_tokio"] } # I guess feature needed, update and then remove it
wiremock = "0.6"
libc = "0.2.172"
