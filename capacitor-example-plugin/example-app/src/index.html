<!doctype html>
<html lang="en" dir="ltr" class="hydrated">
  <head>
    <meta charset="UTF-8" />
    <title>Example Capacitor App</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <main>
      <h1>Capacitor Test Plugin Project</h1>
      <p>Changed version</p>
      <p>
        This project can be used to test out the functionality of your plugin. Nothing in the
        <em>example-app/</em> folder will be published to npm when using this template, so you can create away!
      </p>


      <!-- <label for="echoInput">Echo Text:</label> -->
      <!-- <input type="text" id="echoInput" name="echoInput" value="Hello World!" /> -->
      <!-- <button onclick="testEcho()">Click Me!</button> -->

      <button id="echo">🔁 Echo</button>
      <button id="toast">🍞 Show Toast</button>
      <div id="output"></div>
    </main>


    <script type="module">
      import { IzelsUsefulPlugin } from 'capacitor-izels-example-plugin';

      const echoBtn = document.getElementById('echo');
      const toastBtn = document.getElementById('toast');
      const output = document.getElementById('output');

      echoBtn.onclick = async () => {
        const res = await IzelsUsefulPlugin.echoMe();
        output.textContent = `Plugin returned: ${res.value}`;
      };

      toastBtn.onclick = async () => {
        await IzelsUsefulPlugin.showToast({ message: "Hello from native toast!" });
      };
    </script>

    <!-- <script src="./js/example.js" type="module"></script> -->
  </body>
</html>
